name: Compatibility

# Runs tests/compat against the pinned library versions in
# scripts/compat_matrix.py, which is also the source of the job matrix and of
# docs/compatibility.md.
#
# - Pull requests into devel or main: each integration's minimum pins on its
#   oldest Python and current pins on its newest ("pr" profile).
# - Nightly, release branches and manual runs: every combination ("full").

on:
  push:
    branches: [ main, 'release/**' ]
    paths:
      - 'wildedge/**'
      - 'tests/compat/**'
      - 'scripts/compat_matrix.py'
      - 'pyproject.toml'
      - '.github/workflows/compat.yml'
  pull_request:
    branches: [ main, devel ]
    types: [opened, synchronize, reopened]
    paths:
      - 'wildedge/**'
      - 'tests/compat/**'
      - 'scripts/compat_matrix.py'
      - 'pyproject.toml'
      - '.github/workflows/compat.yml'
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - uses: actions/checkout@v4
      - id: rows
        env:
          PROFILE: ${{ (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')) && 'pr' || 'full' }}
        run: echo "rows=$(python scripts/compat_matrix.py github-matrix --profile "$PROFILE")" >> "$GITHUB_OUTPUT"

  compat:
    needs: matrix
    name: compat (${{ matrix.python-version }}, ${{ matrix.integration }}, ${{ matrix.version-set }})
    runs-on: ${{ matrix.runs-on }}
    continue-on-error: ${{ matrix.canary }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.rows) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio pytest-mock
      - name: Install compatibility dependencies
        run: |
          python scripts/compat_matrix.py deps \
            --integration "${{ matrix.integration }}" \
            --version-set "${{ matrix.version-set }}" \
            --python-version "${{ matrix.python-version }}" > compat-requirements.txt
          pip install -r compat-requirements.txt
      - name: Check installed versions match the pins
        run: |
          python scripts/compat_matrix.py verify \
            --integration "${{ matrix.integration }}" \
            --version-set "${{ matrix.version-set }}" \
            --python-version "${{ matrix.python-version }}"
      - name: Run compatibility tests
        run: python -m pytest "tests/compat/test_${{ matrix.integration }}_compat.py" -q -rxX
